<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Aniket Chakraborty: AI/ML, Computer Vision and Edge AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="type">
      <rect x="84" y="262" width="0" height="34">
        <animate attributeName="width" values="0;560;560;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="frame"><rect x="780" y="50" width="360" height="260"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .tag { font-size: 12px; font-weight: 700; fill: #0a0f1c; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#22d3ee" stroke-opacity="0.18"/>

  <!-- HUD: recording indicator -->
  <circle cx="68" cy="52" r="6" fill="#f43f5e">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="57" class="mono" font-size="14" fill="#94a3b8">inference running on-device</text>

  <!-- Name -->
  <text x="60" y="150" class="sans" font-size="58" font-weight="800" fill="url(#ac)" letter-spacing="-1">Aniket Chakraborty</text>
  <text x="62" y="190" class="sans" font-size="21" fill="#e2e8f0">MCA student at Dayananda Sagar University, Bengaluru</text>
  <text x="62" y="222" class="sans" font-size="21" fill="#94a3b8">Building AI that sees, senses, and runs at the edge.</text>

  <!-- Terminal line -->
  <rect x="60" y="250" width="610" height="58" rx="10" fill="#0a0f1c" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="76" y="286" class="mono" font-size="17" fill="#22d3ee">$</text>
  <g clip-path="url(#type)">
    <text x="96" y="286" class="mono" font-size="17" fill="#e2e8f0">python deploy.py --target edge --measure fps,latency,memory</text>
  </g>

  <!-- Detection frame -->
  <g clip-path="url(#frame)">
    <rect x="780" y="50" width="360" height="260" fill="#22d3ee" fill-opacity="0.03"/>

    <!-- chip -->
    <g transform="translate(0,0)">
      <rect x="836" y="108" width="44" height="44" rx="6" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="846" y="118" width="24" height="24" rx="3" fill="#a78bfa" fill-opacity="0.7"/>
      <path d="M844 108v-9M858 108v-9M872 108v-9M844 152v9M858 152v9M872 152v9M836 120h-9M836 130h-9M836 140h-9M880 120h9M880 130h9M880 140h9" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <g>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" begin="0.4s" repeatCount="indefinite"/>
        <rect x="816" y="86" width="86" height="86" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
        <rect x="816" y="68" width="38" height="18" rx="3" fill="#22d3ee"/>
        <text x="824" y="81" class="mono tag">IoT</text>
      </g>
    </g>

    <!-- lens -->
    <g>
      <circle cx="1010" cy="142" r="26" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="1010" cy="142" r="14" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="1004" cy="136" r="4" fill="#e2e8f0" fill-opacity="0.8"/>
      <g>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
        <rect x="972" y="104" width="76" height="76" rx="4" fill="none" stroke="#a78bfa" stroke-width="2"/>
        <rect x="972" y="86" width="62" height="18" rx="3" fill="#a78bfa"/>
        <text x="980" y="99" class="mono tag">Vision</text>
      </g>
    </g>

    <!-- tiny neural net -->
    <g>
      <g stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="1.5">
        <path d="M850 232L900 244M850 232L900 270M850 256L900 244M850 256L900 270M850 280L900 244M850 280L900 270M900 244L950 257M900 270L950 257"/>
      </g>
      <g fill="#22d3ee">
        <circle cx="850" cy="232" r="6"/><circle cx="850" cy="256" r="6"/><circle cx="850" cy="280" r="6"/>
        <circle cx="900" cy="244" r="6"/><circle cx="900" cy="270" r="6"/>
        <circle cx="950" cy="257" r="7" fill="#a78bfa"/>
      </g>
      <g>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" begin="2s" repeatCount="indefinite"/>
        <rect x="826" y="206" width="146" height="92" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
        <rect x="826" y="188" width="70" height="18" rx="3" fill="#22d3ee"/>
        <text x="834" y="201" class="mono tag">TinyML</text>
      </g>
    </g>

    <!-- edge: fps bars -->
    <g>
      <g fill="#a78bfa" fill-opacity="0.85">
        <rect x="1016" y="260" width="12" height="20"><animate attributeName="height" values="14;38;22;32;14" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="266;242;258;248;266" dur="2.4s" repeatCount="indefinite"/></rect>
        <rect x="1036" y="260" width="12" height="20"><animate attributeName="height" values="30;16;36;20;30" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="250;264;244;260;250" dur="2.1s" repeatCount="indefinite"/></rect>
        <rect x="1056" y="260" width="12" height="20"><animate attributeName="height" values="20;34;14;30;20" dur="2.7s" repeatCount="indefinite"/><animate attributeName="y" values="260;246;266;250;260" dur="2.7s" repeatCount="indefinite"/></rect>
        <rect x="1076" y="260" width="12" height="20"><animate attributeName="height" values="36;22;32;16;36" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="244;258;248;264;244" dur="1.9s" repeatCount="indefinite"/></rect>
      </g>
      <path d="M1008 282H1100" stroke="#e2e8f0" stroke-width="2"/>
      <g>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
        <rect x="998" y="226" width="116" height="68" rx="4" fill="none" stroke="#a78bfa" stroke-width="2"/>
        <rect x="998" y="208" width="68" height="18" rx="3" fill="#a78bfa"/>
        <text x="1006" y="221" class="mono tag">Edge AI</text>
      </g>
    </g>

    <!-- scan line -->
    <rect x="780" y="50" width="360" height="40" fill="url(#scan)">
      <animate attributeName="y" values="30;290;30" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="780" y="50" width="360" height="2" fill="#22d3ee" fill-opacity="0.9">
      <animate attributeName="y" values="68;308;68" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- viewfinder corners -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M780 80V50h30M1110 50h30v30M780 280v30h30M1110 310h30v-30"/>
  </g>
  <text x="780" y="334" class="mono" font-size="13" fill="#64748b">detected: IoT, Vision, TinyML, Edge AI</text>
</svg>
