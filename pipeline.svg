<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Pipeline: sense, pre-process, infer, optimize, act. Measured by accuracy, latency, FPS and memory." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .flow { stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect width="1200" height="250" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="17.5" fill="none" stroke="#22d3ee" stroke-opacity="0.18"/>

  <!-- connectors -->
  <g stroke="url(#ac)" stroke-width="2.5" fill="none" class="flow">
    <path d="M230 105H270"/><path d="M460 105H500"/><path d="M690 105H730"/><path d="M920 105H960"/>
  </g>

  <!-- stages -->
  <g>
    <rect x="40" y="55" width="190" height="100" rx="12" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="60" y="95" class="sans" font-size="21" font-weight="700" fill="#e2e8f0">Sense</text>
    <text x="60" y="122" class="mono" font-size="13" fill="#94a3b8">camera, sensors, MCU</text>

    <rect x="270" y="55" width="190" height="100" rx="12" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="290" y="95" class="sans" font-size="21" font-weight="700" fill="#e2e8f0">Pre-process</text>
    <text x="290" y="122" class="mono" font-size="13" fill="#94a3b8">resize, normalize, filter</text>

    <rect x="500" y="55" width="190" height="100" rx="12" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="520" y="95" class="sans" font-size="21" font-weight="700" fill="#e2e8f0">Infer</text>
    <text x="520" y="122" class="mono" font-size="13" fill="#94a3b8">CNN, neural networks</text>

    <rect x="730" y="55" width="190" height="100" rx="12" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="750" y="95" class="sans" font-size="21" font-weight="700" fill="#e2e8f0">Optimize</text>
    <text x="750" y="122" class="mono" font-size="13" fill="#94a3b8">quantize, prune, profile</text>

    <rect x="960" y="55" width="190" height="100" rx="12" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="980" y="95" class="sans" font-size="21" font-weight="700" fill="#e2e8f0">Act</text>
    <text x="980" y="122" class="mono" font-size="13" fill="#94a3b8">alert, speak, actuate</text>
  </g>

  <!-- travelling packet -->
  <circle r="6" fill="#22d3ee">
    <animateMotion dur="5s" repeatCount="indefinite" path="M40 105H1150"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- feedback loop: measurements feed back into the model -->
  <path d="M1055 160V196H595V166" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M589 172L595 160L601 172Z" fill="#64748b"/>
  <text x="640" y="224" class="mono" font-size="14" fill="#94a3b8">measure accuracy, latency, FPS, memory, then improve</text>
</svg>
